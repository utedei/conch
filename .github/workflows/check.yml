name: Check

on: 
  push:
    branches:
      - "master"
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  licenses:
    name: License REUSE spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install reuse
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install reuse
      - name: Check REUSE spec
        run: ~/venv/bin/reuse lint
  changelog:
    name: Changelog format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install kacl
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install python-kacl
      - name: Check changelog format
        run: ~/venv/bin/kacl-cli verify
  code-checks:
    name: Tests and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # This is needed so that git-describe works properly to set the version
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Formatting
        run: cargo fmt --check
      - name: Linting
        run: cargo clippy
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Integration tests
        run: |
          oci/build.sh
          tests/integration/integration.sh
        env:
          TERM: xterm-256color

